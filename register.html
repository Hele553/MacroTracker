<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register – MacroTracker</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-card__logo">
            <img src="assets/icon/macro.png" alt="">
            <span>MacroTracker</span>
        </div>
        <div class="login-card__heading">
            <h1>Create an account</h1>
            <p>Start tracking your macros</p>
        </div>
        <div class="login-card__fields">
            <div class="field">
                <label class="field__label">Username</label>
                <input type="text" id="reg-user" class="field__input" placeholder="mario.rossi">
            </div>
            <div class="field">
                <label class="field__label">Email</label>
                <input type="email" id="reg-email" class="field__input" placeholder="mario@example.com">
            </div>
            <div class="field">
                <label class="field__label">Password</label>
                <input type="password" id="reg-pass" class="field__input" placeholder="••••••••">
            </div>
            <div class="field">
                <label class="field__label">Daily calories</label>
                <input type="number" id="reg-calories" class="field__input" placeholder="2000" min="500" max="9000">
            </div>
        </div>
        <p id="reg-error" class="login-card__error"></p>
        <button class="login-card__btn" id="registerBtn">Sign up</button>
        <div class="login-card__divider">or</div>
        <p class="login-card__footer">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </div>
    <script src="js/modules/register.js" type="module"></script>
</body>
</html>
